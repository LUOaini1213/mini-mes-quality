name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      MESQ_NO_DENSE: "1"        # BM25-only SOP retrieval in CI (no model download)
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only torch, no dataset, no embedding model)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ci.txt
      - name: Tests (synthetic fixtures + committed results/ only; no images are needed)
        run: python -m pytest -q
